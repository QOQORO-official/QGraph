name: Build, test & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM wasm toolchain (clang + wasm-ld)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld clang
          echo "clang: $(clang --version | head -1)"
          echo "wasm-ld: $(wasm-ld --version)"

      - name: Cache Nim compiler
        uses: actions/cache@v4
        with:
          path: build/.cache
          key: nim-2.0.14-linux-x64

      - name: Build the Nim -> WASM engine
        run: bash tools/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Behaviour tests (recorded against the original editor)
        run: |
          python3 -m http.server 8123 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://localhost:8123/web/index.html >/dev/null && break; sleep 0.5; done
          node tests/ui/inspector.js
          node tests/ui/golden.js

      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp -r web/index.html web/favicon.svg web/manifest.webmanifest web/js web/styles web/stencils _site/
          touch _site/.nojekyll

      - name: Stamp the build version
        run: bash tools/stamp.sh _site "${GITHUB_SHA::8}"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
