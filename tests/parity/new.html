<!DOCTYPE html><html><head><meta charset="utf-8">
<script src="../../web/js/QGraphWasm.js"></script>
<script src="../../web/js/RichText.js"></script>
<script src="../../web/js/Stencils.js"></script>
<script src="../../web/js/CanvasPaint.js"></script>
<script src="scene.js"></script>
</head><body><script>
window.render = function() {
  return QGraphWasm.load().then(function() {
    return Promise.all(['basic', 'flowchart', 'arrows'].map(function(n) {
      return fetch('../../web/stencils/' + n + '.xml').then(function(r) { return r.text(); })
        .then(function(xml) { PixelStencils.parse(xml, 'mxgraph.' + n); });
    }));
  }).then(function() {
    return sceneViews.map(function(view) {
      var painter = new PixelScenePainter();
      painter.sync(JSON.parse(JSON.stringify(makeScene())));
      var canvas = document.createElement('canvas');
      painter.render(canvas, view);
      return canvas.toDataURL('image/png');
    });
  });
};
window.compare = function(a, b) {
  function load(src) { return new Promise(function(res) { var i = new Image(); i.onload = function() { res(i); }; i.src = src; }); }
  return Promise.all([load(a), load(b)]).then(function(imgs) {
    var w = imgs[0].width, h = imgs[0].height;
    if (imgs[1].width !== w || imgs[1].height !== h) return { sizeMismatch: [w, h, imgs[1].width, imgs[1].height] };
    function data(img) { var c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d'); x.drawImage(img, 0, 0); return x.getImageData(0, 0, w, h).data; }
    var da = data(imgs[0]), db = data(imgs[1]);
    var diff = 0, maxd = 0, minX = w, minY = h, maxX = 0, maxY = 0;
    var out = document.createElement('canvas'); out.width = w; out.height = h;
    var octx = out.getContext('2d'); var od = octx.createImageData(w, h);
    for (var p = 0; p < da.length; p += 4) {
      var d = Math.max(Math.abs(da[p]-db[p]), Math.abs(da[p+1]-db[p+1]), Math.abs(da[p+2]-db[p+2]), Math.abs(da[p+3]-db[p+3]));
      var g = da[p] * 0.3 + da[p+1] * 0.6 + da[p+2] * 0.1;
      od.data[p] = d > 8 ? 255 : g; od.data[p+1] = d > 8 ? 0 : g; od.data[p+2] = d > 8 ? 0 : g; od.data[p+3] = 255;
      if (d > 8) { diff++; var px = (p / 4) % w, py = Math.floor(p / 4 / w);
        minX = Math.min(minX, px); maxX = Math.max(maxX, px); minY = Math.min(minY, py); maxY = Math.max(maxY, py); }
      maxd = Math.max(maxd, d);
    }
    octx.putImageData(od, 0, 0);
    return { diffPixels: diff, maxDelta: maxd, box: diff ? [minX, minY, maxX, maxY] : null, diffImage: out.toDataURL('image/png') };
  });
};
</script></body></html>
