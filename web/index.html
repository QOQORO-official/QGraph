<!DOCTYPE html>

    <meta name="description" content="QGraph Studio: a diagram and flowchart editor written in Nim and compiled to WebAssembly. The UI, engine, formats and media all run in the module; the page only hosts it.">

    <meta name="theme-color" content="#161920" media="(prefers-color-scheme: dark)">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>QGraph Studio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" type="text/css" href="styles/qgraph.css">
    <!-- The generic host: DOM command buffer, events, timers, workers. The
         application itself is js/qgraph.wasm. -->

</head>
